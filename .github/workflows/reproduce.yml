name: Offline artifact reproduction
on:
  pull_request:
  push:
    branches: [main, artifact/initial-evidence-import]
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen evidence (no provider keys)
        run: python scripts/agent_2027_routing_evidence.py --check
